<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NEBULA HERO VR</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #000;

    font-family: Arial, sans-serif;

    color: white;
}

#game {

    position: fixed;

    inset: 0;
}

canvas {

    display: block;
}


/* =========================
   MENÚ
========================= */

#menu {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            #071c2b,
            #020207 70%
        );

    z-index: 10;
}

.panel {

    width: min(500px, 90vw);

    padding: 35px;

    border: 1px solid #00e5ff;

    background:
        rgba(0, 0, 0, .75);

    box-shadow:
        0 0 40px
        rgba(0, 229, 255, .25);
}

h1 {

    margin: 0 0 10px;

    font-size: 48px;

    color: #00e5ff;

    text-shadow:
        0 0 25px #00e5ff;
}

p {

    color: #aaa;

    line-height: 1.5;
}

button {

    width: 100%;

    margin-top: 15px;

    padding: 16px;

    border: 1px solid #00e5ff;

    background: #071820;

    color: white;

    font-size: 17px;

    font-weight: bold;

    cursor: pointer;
}

button:hover {

    background: #00e5ff;

    color: black;

    box-shadow:
        0 0 30px #00e5ff;
}


/* =========================
   HUD
========================= */

#hud {

    position: absolute;

    top: 20px;

    left: 20px;

    z-index: 5;

    display: none;

    pointer-events: none;
}

.stat {

    margin-bottom: 8px;

    padding: 10px 15px;

    background:
        rgba(0, 0, 0, .6);

    border-left:
        3px solid #00e5ff;
}

.label {

    color: #777;

    font-size: 11px;
}

.value {

    font-size: 25px;

    font-weight: bold;
}


/* =========================
   MENSAJE
========================= */

#message {

    position: absolute;

    top: 50%;

    left: 50%;

    transform:
        translate(-50%, -50%);

    font-size: 45px;

    font-weight: bold;

    opacity: 0;

    pointer-events: none;

    z-index: 20;
}

</style>

</head>


<body>


<div id="game"></div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="stat">

        <div class="label">
            PUNTOS
        </div>

        <div
            id="score"
            class="value">

            0

        </div>

    </div>


    <div class="stat">

        <div class="label">
            COMBO
        </div>

        <div
            id="combo"
            class="value">

            x0

        </div>

    </div>

</div>


<div id="message"></div>


<!-- =========================
     MENÚ
========================= -->

<div id="menu">

    <div class="panel">

        <h1>
            NEBULA HERO
        </h1>

        <p>
            Juego musical VR para Meta Quest 3
        </p>

        <p>

            🖐️ Usa tus manos reales para
            golpear las notas.

            <br><br>

            🔵 Mano izquierda

            <br>

            🔴 Mano derecha

            <br>

            🟢 Ambas manos

        </p>


        <button id="vrButton">

            🥽 JUGAR EN META QUEST 3

        </button>


        <button id="desktopButton">

            💻 PROBAR SIN VR

        </button>


        <p id="status"></p>

    </div>

</div>


<script type="module">


/* =========================================================
   THREE.JS
========================================================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================================================
   VARIABLES PRINCIPALES
========================================================= */

let scene;

let camera;

let renderer;

let xrSession = null;

let referenceSpace = null;

let xrMode = false;


/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

let running = false;


/* =========================================================
   ESTADÍSTICAS
========================================================= */

let score = 0;

let combo = 0;

let misses = 0;

let hits = 0;


/* =========================================================
   OBJETOS
========================================================= */

const notes = [];

const hands = [];


/* =========================================================
   CONFIGURACIÓN
========================================================= */

const NOTE_SPEED = 4;

const HIT_DISTANCE = 0.35;


/* =========================================================
   COLORES
========================================================= */

const BLUE =
    0x00aaff;

const RED =
    0xff2244;

const GREEN =
    0x00ff88;


/* =========================================================
   INICIALIZAR
========================================================= */

function init() {


    /* =========================
       ESCENA
    ========================= */

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x020207
        );


    /* =========================
       CÁMARA
    ========================= */

    camera =
        new THREE.PerspectiveCamera(

            70,

            window.innerWidth /
            window.innerHeight,

            0.01,

            100

        );


    camera.position.set(

        0,
        1.6,
        3

    );


    /* =========================
       RENDERER
    ========================= */

    renderer =
        new THREE.WebGLRenderer({

            antialias: true,

            alpha: false

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.xr.enabled =
        true;


    document
        .getElementById("game")
        .appendChild(
            renderer.domElement
        );


    /* =========================
       LUZ AMBIENTE
    ========================= */

    const ambient =
        new THREE.AmbientLight(

            0xffffff,
            1.2

        );


    scene.add(ambient);


    /* =========================
       LUZ AZUL
    ========================= */

    const cyanLight =
        new THREE.PointLight(

            BLUE,
            10,
            15

        );


    cyanLight.position.set(

        0,
        3,
        -4

    );


    scene.add(cyanLight);


    /* =========================
       LUZ ROJA
    ========================= */

    const redLight =
        new THREE.PointLight(

            RED,
            8,
            15

        );


    redLight.position.set(

        4,
        2,
        -8

    );


    scene.add(redLight);


    /* =========================
       ENTORNO
    ========================= */

    createEnvironment();


    /* =========================
       RESIZE
    ========================= */

    window.addEventListener(

        "resize",
        resize

    );


    /* =========================
       LOOP
    ========================= */

    animate();

}



/* =========================================================
   ENTORNO 360°
========================================================= */

function createEnvironment() {


    /* =========================
       CIELO
    ========================= */

    const skyGeometry =
        new THREE.SphereGeometry(

            40,
            64,
            32

        );


    const skyMaterial =
        new THREE.MeshBasicMaterial({

            color:
                0x030510,

            side:
                THREE.BackSide

        });


    const sky =
        new THREE.Mesh(

            skyGeometry,

            skyMaterial

        );


    scene.add(sky);


    /* =========================
       ESTRELLAS
    ========================= */

    const geometry =
        new THREE.BufferGeometry();


    const positions = [];


    for (
        let i = 0;
        i < 1500;
        i++
    ) {


        positions.push(

            (Math.random() - .5) * 70,

            (Math.random() - .5) * 70,

            (Math.random() - .5) * 70

        );

    }


    geometry.setAttribute(

        "position",

        new THREE.Float32BufferAttribute(

            positions,
            3

        )

    );


    const material =
        new THREE.PointsMaterial({

            color:
                0x66ddff,

            size:
                .05

        });


    const stars =
        new THREE.Points(

            geometry,
            material

        );


    scene.add(stars);


    /* =========================
       PISO
    ========================= */

    const floor =
        new THREE.GridHelper(

            50,
            50,
            BLUE,
            0x111133

        );


    floor.position.y =
        0;


    scene.add(floor);


    /* =========================
       PORTAL
    ========================= */

    const portalGeometry =
        new THREE.TorusGeometry(

            4,
            .08,
            16,
            100

        );


    const portalMaterial =
        new THREE.MeshBasicMaterial({

            color:
                BLUE

        });


    const portal =
        new THREE.Mesh(

            portalGeometry,
            portalMaterial

        );


    portal.position.set(

        0,
        2,
        -10

    );


    scene.add(portal);


    /* =========================
       OBJETIVOS
    ========================= */

    createTarget(

        -1.5,
        BLUE

    );


    createTarget(

        1.5,
        RED

    );


    createTarget(

        0,
        GREEN

    );

}



/* =========================================================
   CREAR OBJETIVO
========================================================= */

function createTarget(

    x,
    color

) {


    const geometry =
        new THREE.TorusGeometry(

            .45,
            .06,
            16,
            32

        );


    const material =
        new THREE.MeshBasicMaterial({

            color:
                color

        });


    const ring =
        new THREE.Mesh(

            geometry,
            material

        );


    ring.position.set(

        x,
        1.4,
        -2

    );


    scene.add(ring);

}



/* =========================================================
   CREAR NOTA
========================================================= */

function createNote() {


    const random =
        Math.random();


    let type;

    let color;

    let x;


    /* =========================
       NOTA IZQUIERDA
    ========================= */

    if (
        random < .4
    ) {

        type =
            "left";

        color =
            BLUE;

        x =
            -1.5;

    }


    /* =========================
       NOTA DERECHA
    ========================= */

    else if (
        random < .8
    ) {

        type =
            "right";

        color =
            RED;

        x =
            1.5;

    }


    /* =========================
       NOTA DOBLE
    ========================= */

    else {

        type =
            "both";

        color =
            GREEN;

        x =
            0;

    }


    /* =========================
       GEOMETRÍA
    ========================= */

    const geometry =
        new THREE.IcosahedronGeometry(

            .35,
            1

        );


    const material =
        new THREE.MeshStandardMaterial({

            color:
                color,

            emissive:
                color,

            emissiveIntensity:
                2

        });


    const mesh =
        new THREE.Mesh(

            geometry,
            material

        );


    mesh.position.set(

        x,
        1.4,
        -15

    );


    mesh.userData.type =
        type;


    scene.add(mesh);


    notes.push(mesh);

}



/* =========================================================
   COMPROBAR GOLPE
========================================================= */

function checkHit(

    handPosition,
    handSide

) {


    if (!running) {

        return;

    }


    for (
        let i = notes.length - 1;
        i >= 0;
        i--
    ) {


        const note =
            notes[i];


        const distance =
            handPosition.distanceTo(
                note.position
            );


        if (
            distance >
            HIT_DISTANCE
        ) {

            continue;

        }


        const type =
            note.userData.type;


        let valid =
            false;


        /* IZQUIERDA */

        if (
            type === "left" &&
            handSide === "left"
        ) {

            valid = true;

        }


        /* DERECHA */

        if (
            type === "right" &&
            handSide === "right"
        ) {

            valid = true;

        }


        /* DOBLE */

        if (
            type === "both"
        ) {

            valid = true;

        }


        if (valid) {


            hitNote(note);


            notes.splice(
                i,
                1
            );


            break;

        }

    }

}



/* =========================================================
   ACIERTO
========================================================= */

function hitNote(note) {


    scene.remove(note);


    hits++;

    combo++;


    score +=

        100 +
        combo * 10;


    document
        .getElementById("score")
        .textContent =
        score;


    document
        .getElementById("combo")
        .textContent =
        "x" + combo;


    showMessage(

        "¡ACIERTO!",

        "#00ff88"

    );

}



/* =========================================================
   FALLO
========================================================= */

function missNote(note) {


    scene.remove(note);


    misses++;


    combo = 0;


    document
        .getElementById("combo")
        .textContent =
        "x0";


    showMessage(

        "MISS",

        "#ff2244"

    );

}



/* =========================================================
   MENSAJE
========================================================= */

function showMessage(

    text,
    color

) {


    const element =
        document.getElementById(
            "message"
        );


    element.textContent =
        text;


    element.style.color =
        color;


    element.style.textShadow =
        `0 0 30px ${color}`;


    element.style.opacity =
        "1";


    setTimeout(

        () => {

            element.style.opacity =
                "0";

        },

        350

    );

}



/* =========================================================
   ACTUALIZAR NOTAS
========================================================= */

let lastSpawn =
    0;


function updateNotes(

    delta

) {


    if (!running) {

        return;

    }


    for (
        let i = notes.length - 1;
        i >= 0;
        i--
    ) {


        const note =
            notes[i];


        /* MOVER */

        note.position.z +=

            NOTE_SPEED *
            delta;


        /* ROTAR */

        note.rotation.x +=
            delta * 2;


        note.rotation.y +=
            delta * 3;


        /* =========================
           SI PASÓ EL OBJETIVO
        ========================= */

        if (
            note.position.z >
            -1.4
        ) {


            missNote(note);


            notes.splice(
                i,
                1
            );

        }

    }

}



/* =========================================================
   CREAR REPRESENTACIÓN DE MANO
========================================================= */

function createHandModel(

    xrHand,
    side

) {


    const group =
        new THREE.Group();


    group.userData.xrHand =
        xrHand;


    group.userData.side =
        side;


    scene.add(group);


    hands.push(group);


    return group;

}



/* =========================================================
   ACTUALIZAR MANOS
========================================================= */

function updateHands(

    frame

) {


    if (
        !xrSession ||
        !referenceSpace ||
        !running
    ) {

        return;

    }


    for (
        const handGroup of hands
    ) {


        const xrHand =
            handGroup.userData.xrHand;


        const side =
            handGroup.userData.side;


        const joint =
            xrHand.get(

                "index-finger-tip"

            );


        if (!joint) {

            continue;

        }


        const pose =
            frame.getJointPose(

                joint,

                referenceSpace

            );


        if (!pose) {

            continue;

        }


        const p =
            pose.transform.position;


        const position =
            new THREE.Vector3(

                p.x,
                p.y,
                p.z

            );


        handGroup.position.copy(
            position
        );


        /* COMPROBAR GOLPE */

        checkHit(

            position,
            side

        );

    }

}



/* =========================================================
   CONFIGURAR MANOS XR
========================================================= */

function setupXRHands(

    session

) {


    xrSession =
        session;


    session.addEventListener(

        "inputsourceschange",

        () => {

            updateInputSources();

        }

    );


    updateInputSources();

}



/* =========================================================
   ACTUALIZAR INPUT SOURCES
========================================================= */

function updateInputSources() {


    /* =========================
       ELIMINAR MANOS ANTERIORES
    ========================= */

    for (
        let i = hands.length - 1;
        i >= 0;
        i--
    ) {

        scene.remove(
            hands[i]
        );

    }


    hands.length = 0;


    if (!xrSession) {

        return;

    }


    /* =========================
       BUSCAR MANOS
    ========================= */

    for (
        const source
        of xrSession.inputSources
    ) {


        if (
            source.hand
        ) {


            const side =
                source.handedness;


            createHandModel(

                source.hand,

                side

            );

        }

    }

}



/* =========================================================
   ENTRAR EN VR
========================================================= */

async function startVR() {


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Iniciando VR...";


    /* =========================
       COMPROBAR WEBXR
    ========================= */

    if (
        !navigator.xr
    ) {


        status.textContent =
            "WebXR no está disponible.";

        return;

    }


    try {


        /* =========================
           COMPROBAR SOPORTE
        ========================= */

        const supported =
            await navigator.xr.isSessionSupported(

                "immersive-vr"

            );


        if (!supported) {


            status.textContent =
                "Este dispositivo no soporta VR inmersiva.";

            return;

        }


        /* =========================
           SOLICITAR SESIÓN
        ========================= */

        const session =
            await navigator.xr.requestSession(

                "immersive-vr",

                {

                    requiredFeatures: [

                        "local-floor"

                    ],

                    optionalFeatures: [

                        "hand-tracking",

                        "bounded-floor"

                    ]

                }

            );


        /* =========================
           ACTIVAR MODO VR
        ========================= */

        xrMode =
            true;


        xrSession =
            session;


        /* =========================
           CONECTAR SESSION
        ========================= */

        await renderer.xr.setSession(

            session

        );


        /* =========================
           REFERENCE SPACE
        ========================= */

        referenceSpace =
            await session.requestReferenceSpace(

                "local-floor"

            );


        /* =========================
           MANOS
        ========================= */

        setupXRHands(

            session

        );


        /* =========================
           OCULTAR MENÚ
        ========================= */

        document
            .getElementById("menu")
            .style.display =
            "none";


        /* =========================
           MOSTRAR HUD
        ========================= */

        document
            .getElementById("hud")
            .style.display =
            "block";


        /* =========================
           EVENTO SALIR VR
        ========================= */

        session.addEventListener(

            "end",

            () => {


                xrSession =
                    null;


                referenceSpace =
                    null;


                xrMode =
                    false;


                /* DETENER JUEGO */

                running =
                    false;


                /* OCULTAR HUD */

                document
                    .getElementById("hud")
                    .style.display =
                    "none";


                /* MOSTRAR MENÚ */

                document
                    .getElementById("menu")
                    .style.display =
                    "flex";


                /* BORRAR NOTAS */

                for (
                    let i = notes.length - 1;
                    i >= 0;
                    i--
                ) {

                    scene.remove(
                        notes[i]
                    );

                }


                notes.length = 0;


            }

        );


        /* =========================
           EMPEZAR JUEGO
        ========================= */

        startGame();


    }

    catch (error) {


        console.error(
            error
        );


        status.textContent =
            "No se pudo iniciar la experiencia VR.";

    }

}



/* =========================================================
   MODO ESCRITORIO
========================================================= */

function startDesktop() {


    xrMode =
        false;


    xrSession =
        null;


    referenceSpace =
        null;


    /* =========================
       OCULTAR MENÚ
    ========================= */

    document
        .getElementById("menu")
        .style.display =
        "none";


    /* =========================
       MOSTRAR HUD
    ========================= */

    document
        .getElementById("hud")
        .style.display =
        "block";


    /* =========================
       EMPEZAR
    ========================= */

    startGame();

}



/* =========================================================
   INICIAR JUEGO
========================================================= */

function startGame() {


    /* =========================
       ACTIVAR ESTADO
    ========================= */

    running =
        true;


    /* =========================
       REINICIAR ESTADÍSTICAS
    ========================= */

    score =
        0;

    combo =
        0;

    hits =
        0;

    misses =
        0;


    /* =========================
       BORRAR NOTAS ANTERIORES
    ========================= */

    for (
        let i = notes.length - 1;
        i >= 0;
        i--
    ) {

        scene.remove(
            notes[i]
        );

    }


    notes.length = 0;


    /* =========================
       REINICIAR SPAWN
    ========================= */

    lastSpawn =
        0;


    /* =========================
       ACTUALIZAR HUD
    ========================= */

    document
        .getElementById("score")
        .textContent =
        "0";


    document
        .getElementById("combo")
        .textContent =
        "x0";


    /* =========================
       OCULTAR MENSAJE
    ========================= */

    document
        .getElementById("message")
        .style.opacity =
        "0";

}



/* =========================================================
   LOOP
========================================================= */

function animate() {


    renderer.setAnimationLoop(

        render

    );

}



/* =========================================================
   RENDER
========================================================= */

function render(

    time,
    frame

) {


    /* =========================
       DELTA TIME
    ========================= */

    const delta =
        Math.min(

            0.05,

            (
                time -
                (
                    render.lastTime ||
                    time
                )
            ) / 1000

        );


    render.lastTime =
        time;


    /* =========================
       SOLO EJECUTAR SI JUGANDO
    ========================= */

    if (
        stateRunning()
    ) {


        /* =========================
           SPAWN
        ========================= */

        lastSpawn +=
            delta * 1000;


        if (
            lastSpawn >= 900
        ) {


            createNote();


            lastSpawn =
                0;

        }


        /* =========================
           ACTUALIZAR NOTAS
        ========================= */

        updateNotes(

            delta

        );


        /* =========================
           ACTUALIZAR MANOS
        ========================= */

        if (
            frame &&
            xrMode
        ) {


            updateHands(

                frame

            );

        }

    }


    /* =========================
       CÁMARA ESCRITORIO
    ========================= */

    if (!xrMode) {


        camera.position.x =

            Math.sin(
                time * 0.00015
            ) * 0.1;

    }


    /* =========================
       RENDER
    ========================= */

    renderer.render(

        scene,

        camera

    );

}



/* =========================================================
   ESTADO DEL JUEGO
========================================================= */

function stateRunning() {


    return running;

}



/* =========================================================
   BOTÓN VR
========================================================= */

document
    .getElementById("vrButton")
    .addEventListener(

        "click",

        startVR

    );



/* =========================================================
   BOTÓN DESKTOP
========================================================= */

document
    .getElementById("desktopButton")
    .addEventListener(

        "click",

        startDesktop

    );



/* =========================================================
   RESIZE
========================================================= */

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}



/* =========================================================
   INICIAR
========================================================= */

init();


</script>

</body>

</html>
